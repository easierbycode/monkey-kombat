<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Kombat Character Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/font-mkii.png">
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: url('menu-bg.png') center center / cover no-repeat #2a2a2a;
      font-family: 'Orbitron', monospace;
      color: #fff;
    }

    a {
      color: #ffd700;
    }

    a:hover {
      color: #ffe763;
    }

    @keyframes borderFlash {
      0% { border-color: #00ff00; }
      50% { border-color: #ffff00; }
      100% { border-color: #00ff00; }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 0.7; transform: scale(1); }
    }

    @keyframes rsFrame0 {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes rsFrame1 {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes mk2flash {
      0% { box-shadow: 0 0 0 4px #ff0, 0 0 15px 4px #ff0; }
      25% { box-shadow: 0 0 0 4px #f00, 0 0 15px 4px #f00; }
      50% { box-shadow: 0 0 0 4px #0ff, 0 0 15px 4px #0ff; }
      75% { box-shadow: 0 0 0 4px #0f0, 0 0 15px 4px #0f0; }
      100% { box-shadow: 0 0 0 4px #ff0, 0 0 15px 4px #ff0; }
    }

    @keyframes mk2sel {
      0% { box-shadow: 0 0 0 4px #fff, 0 0 20px 8px #ff0; }
      50% { box-shadow: 0 0 0 6px #ff0, 0 0 30px 12px #f80; }
      100% { box-shadow: 0 0 0 4px #fff, 0 0 20px 8px #ff0; }
    }

    /* MK bitmap font (assets/font-mkii.png): 36 glyphs A-Z 0-9, 16x16 cells.
       Glyphs are sized in em so the container's font-size scales them. */
    .mkf {
      display: inline-flex;
      align-items: center;
      gap: 0.12em;
    }

    .mkf-glyph {
      width: 1em;
      height: 1em;
      flex: 0 0 auto;
      background-image: url('assets/font-mkii.png');
      background-repeat: no-repeat;
      background-size: 36em 1em;
      image-rendering: pixelated;
    }

    .mkf-space {
      width: 0.4em;
      flex: 0 0 auto;
    }

    .mkf-fb {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 0.85em;
      line-height: 1;
      color: #ffaa00;
      text-shadow: 1px 1px 0 #000;
    }

    .select-screen {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px 2px 12px;
    }

    .rotate-btn {
      background: rgba(17, 17, 17, 0.85);
      border: 2px solid #ffd700;
      color: #ffd700;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 8px 14px;
      min-height: 44px;
      min-width: 64px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: clamp(10px, 1.7vmin, 14px);
      flex: 0 0 auto;
      transition: all 0.2s ease;
    }

    .rotate-btn:hover {
      background: #ffd700;
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .title {
      font-size: clamp(17px, 4.4vmin, 42px);
      white-space: nowrap;
      filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.85));
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      padding: 0;
      appearance: none;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    .dot.active {
      background: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective-origin: 50% 50%;
    }

    .cube {
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .wall {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      box-sizing: border-box;
      display: grid;
      gap: 5px;
      padding: 5px;
      border: 4px solid #222;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3), 0 24px 60px rgba(0, 0, 0, 0.45);
      background:
        radial-gradient(ellipse at 25% 15%, rgba(130, 140, 110, 0.4), transparent 50%),
        radial-gradient(ellipse at 75% 85%, rgba(100, 115, 90, 0.3), transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(110, 125, 100, 0.3), transparent 60%),
        linear-gradient(160deg, #5e6e55, #4a5a42, #3d4d36, #526249);
    }

    .wall-dim {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    .tile {
      position: relative;
      box-sizing: border-box;
      background: #1a1a1a;
      border: 3px solid #333;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      min-width: 0;
      min-height: 0;
      touch-action: manipulation;
      z-index: 1;
      transition: border-color 0.15s ease, filter 0.25s ease, transform 0.15s ease;
    }

    .tile:hover {
      transform: scale(1.05);
      border-color: #888;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      z-index: 10;
    }

    .tile.random {
      background:
        radial-gradient(circle, rgba(60, 70, 55, 0.8), rgba(30, 35, 28, 0.9)),
        linear-gradient(135deg, #3a4a35, #2a3a25);
      border-color: #444;
    }

    .tile.unknown {
      background: #151515;
      border-color: #2a2a2a;
    }

    .tile.cursor {
      animation: borderFlash 0.1s infinite;
      z-index: 10;
      transform: scale(1.05);
    }

    .tile.roulette {
      animation: mk2flash 0.15s linear infinite;
      z-index: 10;
    }

    .tile.pulse {
      animation: mk2sel 0.4s ease-in-out 3;
      z-index: 10;
    }

    .tile.selected {
      border-color: #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .tile.dimmed {
      filter: brightness(0.35);
    }

    .tile img.char {
      max-width: 75%;
      max-height: 75%;
      object-fit: contain;
      filter: brightness(1.1) contrast(1.2);
      pointer-events: none;
    }

    .tile .nameplate {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      overflow: hidden;
    }

    .tile img.rs {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 75%;
      max-height: 75%;
      image-rendering: pixelated;
      filter: brightness(1.5) contrast(1.3) drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
      pointer-events: none;
    }

    .tile img.rs0 {
      animation: rsFrame0 0.4s steps(1) infinite;
    }

    .tile img.rs1 {
      animation: rsFrame1 0.4s steps(1) infinite;
    }

    .tile .qmark {
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #cdd8b8 0%, #8fa878 35%, #46583c 75%, #22301c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 6px rgba(140, 170, 110, 0.35));
      opacity: 0.85;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 10px 8px 10px;
      text-align: center;
    }

    .status {
      font-size: clamp(11px, 2.2vmin, 18px);
      animation: pulseGlow 2s infinite;
      filter: drop-shadow(0 0 6px rgba(255, 170, 0, 0.7));
      max-width: 96vw;
      overflow: hidden;
    }

    .status.chosen {
      filter: hue-rotate(95deg) drop-shadow(0 0 6px rgba(255, 170, 0, 0.7));
    }

    .hints {
      color: rgba(255, 255, 255, 0.55);
      font-size: clamp(8px, 1.5vmin, 12px);
      letter-spacing: 1px;
      font-weight: 400;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0px, rgba(0, 0, 0, 0.22) 1px, transparent 1px, transparent 3px);
      display: none;
    }

    body.game-active {
      background: #111;
      background-image: none;
      cursor: none;
      image-rendering: pixelated;
      overflow: hidden;
    }

    body.game-active .select-screen {
      display: none;
    }

    .game-wrapper {
      position: fixed;
      inset: 0;
      display: none;
      overflow: hidden;
      box-sizing: border-box;
    }

    body.game-active .game-wrapper {
      display: block;
    }

    #gameRoot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #gameRoot canvas {
      image-rendering: pixelated;
    }

    .game-ui {
      position: absolute;
      top: 0px;
      left: 0px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      visibility: hidden;
    }

    .game-ui.visible {
      visibility: visible;
    }

    .back-button {
      background: rgba(17, 17, 17, 0.85);
      border: 2px solid #ffd700;
      color: #ffd700;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 10px 20px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .back-button:hover {
      background: #ffd700;
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .game-status {
      color: #ffd700;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }
  </style>
  <script src="https://assets.codepen.io/11817390/TweenMax.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script>
  // Launcher OSD bridge: once this game has keyboard focus, the parent launcher
  // stops receiving keydowns, so its own ` / ~ / Esc handler never fires.
  // Forward those keys up so the launcher can toggle the in-game Guide/OSD.
  // Capture phase + stopImmediatePropagation so the game itself doesn't also act.
  // No-op when run standalone (not embedded).
  (function () {
    if (window.parent === window) return; // standalone — leave keys to the game
    window.addEventListener("keydown", function (e) {
      if (e.code === "Backquote" || e.key === "`" || e.key === "~" ||
          e.keyCode === 192 || e.key === "Escape") {
        e.preventDefault();
        e.stopImmediatePropagation();
        try { window.parent.postMessage({ type: "tg16-toggle-controls" }, "*"); } catch (_) {}
      }
    }, true);
  })();
</script>
</head>

<body>
  <div class="select-screen">
    <div class="header">
      <button type="button" id="prevBtn" class="rotate-btn" title="Previous game — Q / [ / L1 / LT">&#9664; L1</button>
      <div class="title-block">
        <div class="title mkf" id="title"></div>
        <div class="dots" id="dots"></div>
      </div>
      <button type="button" id="nextBtn" class="rotate-btn" title="Next game — E / ] / R1 / RT">R1 &#9654;</button>
    </div>

    <div class="stage" id="stage">
      <div class="cube" id="cube"></div>
    </div>

    <div class="footer">
      <div class="status mkf" id="status"></div>
      <div class="hints">ARROWS MOVE &middot; ENTER SELECT &middot; R RANDOM &middot; Q / E OR L1 / R1 OR SWIPE &mdash; SWITCH GAME</div>
    </div>

    <div class="scanlines" id="scanlines"></div>
  </div>

  <div class="game-wrapper" id="gameWrapper" aria-live="polite">
    <div class="game-ui">
      <button class="back-button" id="backButton" type="button">← Character Select</button>
      <div class="game-status" id="gameStatus">Select a fighter to begin</div>
    </div>
    <div id="gameRoot"></div>
  </div>

  <script type="module">
    // scene indexes match the roster order in src/main.js
    const ROSTER = [
      { name: 'CYRAX', img: 'assets/cyrax.png', scene: 0 },
      { name: 'PARABOMB', img: 'assets/parabomb.png', scene: 1 },
      { name: 'ANIMUS', img: 'assets/animus.png', scene: 2 },
      { name: 'LIU KANG', img: 'assets/liu-kang.png', scene: 3 },
      { name: 'RAINBOW DASH', img: 'assets/rainbow-cloud.png', scene: 4 },
      { name: 'BOWSER', img: 'assets/bowser.png', scene: 5 },
      { name: 'MIKE TYSON', img: 'assets/tyson.png', scene: 6 },
      { name: 'BEAVIS', img: 'assets/beavis.png', scene: 7 },
      { name: 'SCORPION', img: 'assets/game_asset.png', scene: 8 },
      { name: 'SANTA', img: 'assets/santa.png', scene: 9 },
      { name: 'SONIC', img: 'assets/sonic.png', scene: 10 },
      { name: 'CAT', img: 'assets/cat-idle.png', scene: 11 },
      { name: 'POKEMON', img: 'assets/red-walk-right.png', scene: 12 },
      { name: 'NEMESIS', img: 'assets/nemesis-rocket.png', scene: 13, crop: { w: 100, h: 75, fit: 'cover' } },
      { name: 'NARUTO', img: 'assets/naruto-charge.png', scene: 14 },
      { name: 'SABIN', img: 'assets/sabin-attack.png', scene: 15 },
      { name: 'SUZIE', img: 'assets/suzie-idle.png', scene: 16 },
      { name: 'TRUMP', img: 'assets/country-roulette-box.png', scene: 17 },
      { name: 'MS. PAC-MAN', img: 'assets/ms-pacman-right.png', scene: 18 },
      { name: 'MS. PAC-MAN', img: 'assets/ms-pacman-left.png', scene: 19 },
      { name: 'GOOFY', img: 'assets/goofy-walk.png', scene: 21, crop: { w: 38, h: 80, fit: 'none' } },
      { name: 'CALCULATOR', img: 'assets/mario-brick.png', scene: 22, crop: { w: 64, h: 64, fit: 'none' } },
      { name: 'ENVY MASKED', img: 'assets/envy-idle.png', scene: 23, crop: { w: 40, h: 67, fit: 'none' } },
      { name: 'RYU', img: 'assets/ryu.png', scene: 24, crop: { w: 43, h: 81, fit: 'none' } },
      { name: 'SONIC BOOM', img: 'assets/sonic-boom.png', scene: 25, crop: { w: 31, h: 39, fit: 'none' } }
    ].map((c, ri) => { c.ri = ri; return c; });

    const TITLES = ['MONKEY KOMBAT', 'MONKEY KOMBAT II', 'MONKEY KOMBAT 3', 'MONKEY KOMBAT 4'];
    const ROTATE_DURATION = 0.8;

    // --- MK bitmap font (assets/font-mkii.png, 36 glyphs of 16x16) ---
    const MKF_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

    function mkfRender(el, text) {
      const str = String(text).toUpperCase();
      if (el._mkfText === str) return;
      el._mkfText = str;
      el.textContent = '';
      for (const ch of str) {
        let span;
        if (ch === ' ') {
          span = document.createElement('span');
          span.className = 'mkf-space';
        } else {
          const idx = MKF_CHARS.indexOf(ch);
          span = document.createElement('span');
          if (idx >= 0) {
            span.className = 'mkf-glyph';
            span.style.backgroundPosition = -idx + 'em 0';
          } else {
            span.className = 'mkf-fb';
            span.textContent = ch;
          }
        }
        el.appendChild(span);
      }
    }

    // --- Launcher glue (same contract as the old select screen) ---
    const backButton = document.getElementById('backButton');
    const gameUi = document.querySelector('.game-ui');
    const gameStatusLabel = document.getElementById('gameStatus');
    const urlParams = new URLSearchParams(window.location.search);
    const debugEnabled = urlParams.get('debug') === '1';

    let gameModule = null;
    // bumped on every launch/exit so a launch that was cancelled while its
    // module import was still in flight never boots a hidden zombie game
    let launchGen = 0;

    async function loadGameModule() {
      if (!gameModule) {
        gameModule = await import('./src/main.js');
      }
      return gameModule;
    }

    function sceneFromUrl() {
      let n = Number.parseInt(urlParams.get('scene'), 10);
      if (Number.isNaN(n)) {
        const m = /^#scene-(\d+)$/.exec(window.location.hash);
        if (m) n = Number.parseInt(m[1], 10);
      }
      return n;
    }

    function updateUrl(sceneIndex) {
      const url = new URL(window.location.href);
      if (sceneIndex === null || typeof sceneIndex === 'undefined') {
        url.searchParams.delete('scene');
      } else {
        url.searchParams.set('scene', sceneIndex);
      }

      if (debugEnabled) {
        url.searchParams.set('debug', '1');
      } else {
        url.searchParams.delete('debug');
      }

      url.hash = '';
      window.history.replaceState(null, '', url);
    }

    async function launchScene(sceneIndex, { updateHistory = true } = {}) {
      const idx = Number.parseInt(sceneIndex, 10);
      if (Number.isNaN(idx)) {
        return;
      }

      const gen = ++launchGen;
      document.body.classList.add('game-active');
      gameStatusLabel.textContent = 'Press ESC to return';
      focusScene(idx);

      try {
        const mod = await loadGameModule();
        if (gen !== launchGen) return; // user exited while the module loaded
        mod.startGame({ sceneIndex: idx, debug: debugEnabled, parent: 'gameRoot' });
      } catch (err) {
        console.error('Failed to start game', err);
        if (gen !== launchGen) return;
        document.body.classList.remove('game-active');
        setState({ selected: null });
        return;
      }

      if (updateHistory) {
        updateUrl(idx);
      }
    }

    function exitToSelect() {
      launchGen++;
      if (gameModule) {
        gameModule.destroyGame();
      }
      // Phaser doesn't reliably remove its canvas on destroy; don't let dead
      // WebGL canvases pile up across launches (contexts are browser-capped)
      document.querySelectorAll('#gameRoot canvas').forEach((c) => c.remove());
      document.body.classList.remove('game-active');
      gameStatusLabel.textContent = 'Select a fighter to begin';
      gameUi.classList.remove('visible');
      updateUrl(null);
      setState({ selected: null });
    }

    backButton.addEventListener('click', () => {
      exitToSelect();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.body.classList.contains('game-active')) {
        event.preventDefault();
        exitToSelect();
      }
    });

    document.addEventListener('enemy-defeated', () => {
      gameUi.classList.add('visible');
    });

    // --- Rotating cube character select ---
    const state = {
      wall: 0,
      angle: 0,
      cursor: 0,
      selected: null,
      roulette: -1,
      rouletteActive: false,
      pulseWall: -1,
      pulseTile: -1,
      dimOthers: false,
      portrait: window.innerHeight > window.innerWidth
    };
    let locked = false;
    let spinT = null;
    let gpPrev = [], axPrev = [0, 0], gpResync = true, touch = null;

    const stageEl = document.getElementById('stage');
    const cubeEl = document.getElementById('cube');
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const dotsEl = document.getElementById('dots');
    const dotEls = [];

    document.getElementById('scanlines').style.display =
      (urlParams.get('scanlines') === '1' || urlParams.get('scanlines') === 'true') ? 'block' : 'none';

    for (let i = 0; i < 4; i++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      dot.title = TITLES[i];
      dot.setAttribute('aria-label', TITLES[i]);
      dot.addEventListener('click', () => { if (selectActive()) rotateTo(i); });
      dotsEl.appendChild(dot);
      dotEls.push(dot);
    }

    document.getElementById('prevBtn').addEventListener('click', () => { if (selectActive()) rotate(-1); });
    document.getElementById('nextBtn').addEventListener('click', () => { if (selectActive()) rotate(1); });

    function selectActive() {
      return !document.body.classList.contains('game-active');
    }

    function grid() {
      const cols = state.portrait ? 4 : 6;
      const rows = state.portrait ? 6 : 4;
      const mid = (Math.ceil(rows / 2) - 1) * cols + Math.floor(cols / 2);
      return { cols, rows, mid, cap: cols * rows };
    }

    function wallsData() {
      const g = grid();
      const per = g.cap - 1;
      return [0, 1, 2, 3].map((w) => {
        const chars = ROSTER.slice(w * per, w * per + per);
        const tiles = [];
        let ci = 0;
        for (let i = 0; i < g.cap; i++) {
          if (i === g.mid) { tiles.push({ kind: 'random' }); continue; }
          const c = chars[ci++];
          tiles.push(c ? { kind: 'char', ...c } : { kind: 'unknown' });
        }
        return tiles;
      });
    }

    // DOM caches, rebuilt when the grid shape (orientation) changes
    let wallEls = [], tileEls = [], dimEls = [], builtCols = 0;
    const layout = { tileW: 100, tileH: 75, wallW: 0, wallH: 0, depth: 0 };

    function measureLayout() {
      const g = grid();
      const r = stageEl.getBoundingClientRect();
      const gap = 5, pad = 5, bord = 4;
      const chrome = 2 * (pad + bord);
      const availW = Math.max(120, r.width * 0.97 - chrome - (g.cols - 1) * gap);
      const availH = Math.max(120, r.height * 0.97 - chrome - (g.rows - 1) * gap);
      const tileW = Math.min(availW / g.cols, (availH / g.rows) * (4 / 3));
      layout.tileW = tileW;
      layout.tileH = tileW * 0.75;
      layout.wallW = g.cols * tileW + (g.cols - 1) * gap + chrome;
      layout.wallH = g.rows * layout.tileH + (g.rows - 1) * gap + chrome;
      layout.depth = layout.wallW / 2;
    }

    function buildWalls() {
      const g = grid();
      builtCols = g.cols;
      cubeEl.innerHTML = '';
      wallEls = []; tileEls = []; dimEls = [];
      wallsData().forEach((tiles, w) => {
        const wallEl = document.createElement('div');
        wallEl.className = 'wall';
        wallEl.style.gridTemplateColumns = 'repeat(' + g.cols + ', 1fr)';
        wallEl.style.gridTemplateRows = 'repeat(' + g.rows + ', 1fr)';
        const els = [];
        tiles.forEach((t, i) => {
          const el = document.createElement('div');
          el.className = 'tile ' + t.kind;
          if (t.kind !== 'unknown') {
            el.setAttribute('role', 'button');
            el.setAttribute('aria-label', t.kind === 'char' ? t.name : 'Random select');
            el.tabIndex = -1;
            el.addEventListener('focus', () => {
              if (!locked && selectActive() && w === state.wall) setState({ cursor: i });
            });
          }
          if (t.kind === 'char') {
            const img = document.createElement('img');
            img.className = 'char';
            img.src = t.img;
            img.alt = t.name;
            img.draggable = false;
            el.appendChild(img);
            const nm = document.createElement('div');
            nm.className = 'nameplate mkf';
            mkfRender(nm, t.name);
            el.appendChild(nm);
          } else if (t.kind === 'random') {
            ['random-select0.png', 'random-select1.png'].forEach((src, f) => {
              const img = document.createElement('img');
              img.className = 'rs rs' + f;
              img.src = src;
              img.alt = 'Random select';
              img.draggable = false;
              el.appendChild(img);
            });
          } else {
            const q = document.createElement('div');
            q.className = 'qmark';
            q.textContent = '?';
            el.appendChild(q);
          }
          el.addEventListener('click', () => onTileClick(w, i, t));
          wallEl.appendChild(el);
          els.push(el);
        });
        const dim = document.createElement('div');
        dim.className = 'wall-dim';
        wallEl.appendChild(dim);
        cubeEl.appendChild(wallEl);
        wallEls.push(wallEl);
        tileEls.push(els);
        dimEls.push(dim);
      });
    }

    function render() {
      const g = grid();
      measureLayout();
      if (g.cols !== builtCols) buildWalls();

      stageEl.style.perspective = Math.round(Math.max(1100, layout.wallW * 1.6)) + 'px';
      cubeEl.style.width = Math.round(layout.wallW) + 'px';
      cubeEl.style.height = Math.round(layout.wallH) + 'px';
      cubeEl.style.transition = 'transform ' + ROTATE_DURATION + 's cubic-bezier(0.45, 0, 0.18, 1)';
      cubeEl.style.transform = 'translateZ(' + (-layout.depth).toFixed(1) + 'px) rotateY(' + state.angle + 'deg)';

      const nameFs = Math.max(7, Math.min(14, layout.tileH * 0.11));
      const namePad = Math.max(2, Math.round(layout.tileH * 0.05));
      const qFs = Math.round(layout.tileH * 0.5);
      const cursor = Math.min(state.cursor, g.cap - 1);

      wallsData().forEach((tiles, w) => {
        const isFront = w === state.wall;
        wallEls[w].style.transform = 'rotateY(' + (w * 90) + 'deg) translateZ(' + layout.depth.toFixed(1) + 'px)';
        dimEls[w].style.opacity = isFront ? 0 : 0.3;
        tiles.forEach((t, i) => {
          const el = tileEls[w][i];
          const isCursor = isFront && cursor === i;
          const isSel = state.selected && t.kind === 'char' && t.ri === state.selected.ri;
          const isRoul = isFront && state.roulette === i;
          const isPulse = state.pulseWall === w && state.pulseTile === i;
          el.classList.toggle('roulette', isRoul);
          el.classList.toggle('pulse', !isRoul && isPulse);
          el.classList.toggle('cursor', !isRoul && !isPulse && isCursor);
          el.classList.toggle('selected', !!isSel);
          el.classList.toggle('dimmed', state.dimOthers && !isRoul && !isPulse);
          if (t.kind !== 'unknown') el.tabIndex = isFront ? 0 : -1;
          if (t.kind === 'char') {
            const img = el.querySelector('img.char');
            if (t.crop) {
              const sc = Math.min(1, (layout.tileW * 0.85) / t.crop.w, (layout.tileH * 0.8) / t.crop.h);
              img.style.maxWidth = 'none';
              img.style.maxHeight = 'none';
              img.style.width = t.crop.w + 'px';
              img.style.height = t.crop.h + 'px';
              img.style.objectFit = t.crop.fit;
              img.style.objectPosition = '0 0';
              img.style.imageRendering = 'pixelated';
              img.style.transform = 'scale(' + (Math.round(sc * 100) / 100) + ')';
            }
            const nm = el.querySelector('.nameplate');
            nm.style.fontSize = (Math.round(nameFs * 10) / 10) + 'px';
            nm.style.padding = namePad + 'px 2px';
          } else if (t.kind === 'unknown') {
            el.querySelector('.qmark').style.fontSize = qFs + 'px';
          }
        });
      });

      mkfRender(titleEl, TITLES[state.wall]);
      dotEls.forEach((dot, i) => dot.classList.toggle('active', i === state.wall));
      mkfRender(statusEl, state.rouletteActive ? 'RANDOM SELECT' : (state.selected ? state.selected.name : 'SELECT YOUR FIGHTER'));
      statusEl.classList.toggle('chosen', !!(state.selected && !state.rouletteActive));
    }

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function move(dx, dy) {
      if (locked) return;
      const g = grid();
      const c = Math.min(state.cursor, g.cap - 1);
      let col = c % g.cols;
      let row = Math.floor(c / g.cols);
      if (dx === 1 && col === g.cols - 1) { rotate(1, row * g.cols); return; }
      if (dx === -1 && col === 0) { rotate(-1, row * g.cols + (g.cols - 1)); return; }
      col = Math.min(g.cols - 1, Math.max(0, col + dx));
      row = Math.min(g.rows - 1, Math.max(0, row + dy));
      setState({ cursor: row * g.cols + col });
    }

    function rotate(dir, cursorAfter) {
      if (locked) return;
      setState({
        angle: state.angle - dir * 90,
        wall: ((state.wall + dir) % 4 + 4) % 4,
        cursor: typeof cursorAfter === 'number' ? cursorAfter : state.cursor
      });
    }

    function rotateTo(w) {
      if (locked) return;
      const cur = state.wall;
      if (w === cur) return;
      let d = (w - cur + 4) % 4;
      if (d === 3) d = -1;
      setState({ angle: state.angle - d * 90, wall: w });
    }

    // point the cube at the fighter for a scene (used for deep links / game exit)
    function focusScene(sceneIndex) {
      const c = ROSTER.find((r) => r.scene === sceneIndex);
      if (!c) return;
      const g = grid();
      const per = g.cap - 1;
      const w = Math.floor(c.ri / per);
      const pos = c.ri - w * per;
      const tileIdx = pos < g.mid ? pos : pos + 1;
      setState({ wall: w, angle: -90 * w, cursor: tileIdx });
    }

    function selectCurrent() {
      if (locked) return;
      const g = grid();
      const idx = Math.min(state.cursor, g.cap - 1);
      const t = wallsData()[state.wall][idx];
      if (!t) return;
      if (t.kind === 'random') { startRoulette(); return; }
      if (t.kind !== 'char') return;
      choose(state.wall, idx, t);
    }

    function onTileClick(w, i, t) {
      if (locked || !selectActive()) return;
      if (w !== state.wall) { rotateTo(w); return; }
      setState({ cursor: i });
      if (t.kind === 'random') startRoulette();
      else if (t.kind === 'char') choose(w, i, t);
    }

    // MK2-style lock-in: pulse the chosen fighter, dim the rest, then fight
    function choose(w, i, t) {
      locked = true;
      setState({ selected: { ri: t.ri, name: t.name }, pulseWall: w, pulseTile: i, dimOthers: true });
      spinT = setTimeout(() => {
        locked = false;
        setState({ pulseWall: -1, pulseTile: -1, dimOthers: false });
        launchScene(t.scene);
      }, 1300);
    }

    function startRoulette() {
      if (locked) return;
      const wall = state.wall;
      const tiles = wallsData()[wall];
      const idxs = [];
      tiles.forEach((t, i) => { if (t.kind === 'char') idxs.push(i); });
      if (!idxs.length) {
        rotateTo(0);
        setTimeout(startRoulette, ROTATE_DURATION * 1000 + 80);
        return;
      }
      locked = true;
      setState({ rouletteActive: true, dimOthers: true, selected: null });
      const total = idxs.length === 1 ? 9 : 24 + Math.floor(Math.random() * 8);
      const chosenPos = Math.floor(Math.random() * idxs.length);
      let step = 0;
      let pos = Math.floor(Math.random() * idxs.length);
      const tick = () => {
        pos = (pos + 1) % idxs.length;
        if (step === total - 1) pos = chosenPos;
        setState({ roulette: idxs[pos], cursor: idxs[pos] });
        step++;
        if (step < total) {
          const p = step / total;
          spinT = setTimeout(tick, 60 + Math.pow(p, 2.5) * 300);
        } else {
          const winner = tiles[idxs[pos]];
          setState({ roulette: -1, pulseWall: wall, pulseTile: idxs[pos], selected: { ri: winner.ri, name: winner.name }, rouletteActive: false });
          spinT = setTimeout(() => {
            locked = false;
            setState({ pulseWall: -1, pulseTile: -1, dimOthers: false });
            launchScene(winner.scene);
          }, 1400);
        }
      };
      tick();
    }

    window.addEventListener('keydown', (e) => {
      if (!selectActive()) return;
      const k = e.key;
      // let native buttons (L1/R1, dots, back) keep their own Enter/Space activation
      if ((k === 'Enter' || k === ' ') && e.target instanceof Element && e.target.matches('button')) return;
      if (k === 'ArrowUp') { e.preventDefault(); move(0, -1); }
      else if (k === 'ArrowDown') { e.preventDefault(); move(0, 1); }
      else if (k === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }
      else if (k === 'ArrowRight') { e.preventDefault(); move(1, 0); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); selectCurrent(); }
      else if (k === 'q' || k === 'Q' || k === '[' || k === 'PageUp') { e.preventDefault(); rotate(-1); }
      else if (k === 'e' || k === 'E' || k === ']' || k === 'PageDown') { e.preventDefault(); rotate(1); }
      else if (k === 'r' || k === 'R') { e.preventDefault(); startRoulette(); }
    });

    function pollGamepad() {
      if (!selectActive()) { gpPrev = []; gpResync = true; return; }
      const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
      let gp = null;
      for (let i = 0; i < pads.length; i++) { if (pads[i]) { gp = pads[i]; break; } }
      if (!gp) { gpPrev = []; gpResync = true; return; }
      if (gpResync) {
        // swallow buttons still held from inside a game (or at first connect)
        // so they don't register as fresh presses and instantly re-launch
        gpPrev = gp.buttons.map((b) => b.pressed);
        axPrev = [gp.axes[0] || 0, gp.axes[1] || 0];
        gpResync = false;
        return;
      }
      const prev = gpPrev;
      const pressed = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const edge = (i) => pressed(i) && !prev[i];
      if (edge(4) || edge(6)) rotate(-1);
      if (edge(5) || edge(7)) rotate(1);
      if (edge(12)) move(0, -1);
      if (edge(13)) move(0, 1);
      if (edge(14)) move(-1, 0);
      if (edge(15)) move(1, 0);
      if (edge(0)) selectCurrent();
      if (edge(3)) startRoulette();
      const ax = gp.axes[0] || 0;
      const ay = gp.axes[1] || 0;
      const t = 0.55;
      if (ax > t && axPrev[0] <= t) move(1, 0);
      if (ax < -t && axPrev[0] >= -t) move(-1, 0);
      if (ay > t && axPrev[1] <= t) move(0, 1);
      if (ay < -t && axPrev[1] >= -t) move(0, -1);
      axPrev = [ax, ay];
      gpPrev = gp.buttons.map((b) => b.pressed);
    }
    (function gpLoop() { pollGamepad(); requestAnimationFrame(gpLoop); })();

    stageEl.addEventListener('touchstart', (e) => {
      const t = e.touches && e.touches[0];
      if (t) touch = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    stageEl.addEventListener('touchend', (e) => {
      const t = e.changedTouches && e.changedTouches[0];
      if (t && touch) {
        const dx = t.clientX - touch.x;
        const dy = t.clientY - touch.y;
        if (Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.5 && !locked && selectActive()) {
          rotate(dx < 0 ? 1 : -1);
        }
      }
      touch = null;
    }, { passive: true });

    window.addEventListener('resize', () => {
      const portrait = window.innerHeight > window.innerWidth;
      if (portrait !== state.portrait && locked) {
        // grid shape changes with orientation, so tile indices captured by a
        // running roulette/selection pulse go stale — cancel it cleanly
        clearTimeout(spinT);
        locked = false;
        Object.assign(state, { roulette: -1, rouletteActive: false, pulseWall: -1, pulseTile: -1, dimOthers: false });
      }
      state.portrait = portrait;
      render();
    });
    if (window.ResizeObserver) new ResizeObserver(() => render()).observe(stageEl);

    render();

    // deep link: ?scene=N (or legacy #scene-N) boots straight into that game
    const initialScene = sceneFromUrl();
    if (!Number.isNaN(initialScene) && ROSTER.some((r) => r.scene === initialScene)) {
      launchScene(initialScene, { updateHistory: false });
    } else {
      updateUrl(null);
    }
  </script>
</body>

</html>
